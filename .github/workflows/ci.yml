name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    env:
      # Dummy values satisfy zod's required-var checks; no external API is
      # called by the test suite.
      GROQ_API_KEY: ci-dummy-groq-key
      CLOUDFLARE_API_TOKEN: ci-dummy-cloudflare-token
      CLOUDFLARE_ACCOUNT_ID: ci-dummy-cloudflare-account
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: captain
          POSTGRES_PASSWORD: captain
          POSTGRES_DB: captain_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U captain -d captain_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

  docker:
    name: Build & publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max